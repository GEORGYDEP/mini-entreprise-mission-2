/* ─── Briefing : catalogue, ligne du temps, tableau en liège ─── */
.catalogue{position:relative; margin:22px 0 8px; padding:16px 20px 22px; border-radius:4px; color:var(--encre); font-family:var(--doc); background:var(--papier) var(--grain); box-shadow:var(--ombre-papier)}
.cat-tete{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:3px solid var(--encre); padding-bottom:8px; margin-bottom:16px}
.cat-tete b{font:800 14px var(--doc); letter-spacing:.2em; text-transform:uppercase}
.cat-tete span{font:600 14px var(--doc); color:var(--encre-douce)}
.catalogue .need{margin:0}
.catalogue .need > div{padding:0 0 16px; text-align:left; overflow:hidden; background:#fff; border:1px solid #e2e5ee; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.06)}
.photo{position:relative; display:grid; place-items:center; height:136px; background:radial-gradient(75% 70% at 50% 35%, #fff, var(--teinte,#eef0f6) 65%, #dde1ec)}
.photo > span{position:relative; z-index:1; font-size:64px; line-height:1; filter:drop-shadow(0 12px 9px rgba(0,0,0,.22)); transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.photo::after{content:""; position:absolute; left:30%; right:30%; bottom:14px; height:14px; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.24), transparent)}
.catalogue .ref{display:block; margin:12px 16px 0; font:700 12px var(--mono); color:#7a7f96; letter-spacing:.06em}
.catalogue .need b{margin:2px 16px 4px; font:800 19px var(--doc); color:var(--encre)}
.catalogue .need p{margin:0 16px; font-size:15.5px; color:var(--encre-douce)}
.ligne-temps{list-style:none; position:relative; display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); margin:6px 0 4px; padding:4px 0 0}
.ligne-temps::before{content:""; position:absolute; left:6.25%; right:6.25%; top:33px; height:4px; border-radius:2px; background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--violet),var(--cyan))}
.ligne-temps li{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 3px; text-align:center}
.lt-ico{position:relative; z-index:1; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; font-size:26px; background:radial-gradient(circle at 35% 30%, #2d2160, #160f33); border:3px solid rgba(255,255,255,.85); box-shadow:0 8px 18px rgba(0,0,0,.45)}
.lt-n{position:absolute; z-index:2; top:-2px; left:calc(50% + 14px); width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--yellow); color:#1a1033; font:800 13px var(--mono); box-shadow:0 2px 6px rgba(0,0,0,.4)}
.lt-t{font-size:15px; font-weight:600; line-height:1.25; color:var(--text)}
.liege{position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; margin:14px 0; padding:30px 26px 34px; border-radius:16px;
  background:
    radial-gradient(circle at 30% 40%, rgba(70,35,10,.22) 0 1.2px, transparent 1.8px) 0 0/11px 11px,
    radial-gradient(circle at 70% 70%, rgba(255,235,200,.16) 0 1px, transparent 1.6px) 3px 5px/8px 8px,
    radial-gradient(circle at 50% 50%, rgba(90,50,20,.14) 0 1.6px, transparent 2.4px) 6px 2px/17px 17px,
    linear-gradient(135deg,#c99d66,#b98a55 45%,#c7975f);
  box-shadow:inset 0 0 0 10px #6b4526, inset 0 0 0 12px #4a2f18, inset 0 8px 22px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.45)}
.postit{position:relative; padding:32px 18px 20px; min-height:176px; color:#2a240f; font-size:15.5px; line-height:1.42; background:linear-gradient(180deg,#fff7a8,#fde96b); box-shadow:0 1px 1px rgba(0,0,0,.15), 0 12px 20px rgba(0,0,0,.32); transform:rotate(-2deg)}
.postit:nth-child(2){background:linear-gradient(180deg,#ffd9e3,#ffb9ca); transform:rotate(1.6deg) translateY(6px)}
.postit:nth-child(3){background:linear-gradient(180deg,#d6f4ff,#ace3fa); transform:rotate(-1deg)}
.postit::before{content:""; position:absolute; top:9px; left:50%; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:radial-gradient(circle at 35% 32%, #ff9a9a, #d32f2f 55%, #7f1010); box-shadow:0 4px 5px rgba(0,0,0,.4)}
.postit::after{content:""; position:absolute; right:0; bottom:0; width:26px; height:26px; background:linear-gradient(315deg, transparent 50%, rgba(0,0,0,.09) 50%, rgba(255,255,255,.4))}
.postit .ri{font-size:28px; line-height:1}
.postit b{display:block; margin:8px 0 6px; font:700 25px/1.08 var(--main); color:#1d2a6b}
@media (max-width:760px){
  .ligne-temps{grid-template-columns:1fr; gap:12px}
  .ligne-temps::before{left:28px; right:auto; top:10px; bottom:10px; width:4px; height:auto; background:linear-gradient(180deg,var(--yellow),var(--orange),var(--pink),var(--violet),var(--cyan))}
  .ligne-temps li{flex-direction:row; text-align:left; gap:16px}
  .lt-ico{flex:none; width:56px; height:56px}
  .lt-n{left:38px}
  .lt-t{font-size:16px}
  .liege{grid-template-columns:1fr; padding:28px 22px}
  .postit{min-height:0}
}

/* ─── Fiches réalistes : les biens et les méthodes de recherche ─── */
.choice.fiche{padding:0 0 18px; overflow:hidden; border:0; border-radius:12px; color:var(--encre); font-family:var(--doc); background:var(--papier) var(--grain); -webkit-backdrop-filter:none; backdrop-filter:none;
  box-shadow:0 1px 2px rgba(0,0,0,.2), 0 14px 30px rgba(0,0,0,.42)}

.choice.fiche:hover .photo > span{transform:scale(1.08) rotate(-4deg)}
.choice.fiche.on{background-color:#fff; box-shadow:0 0 0 4px #22c55e, 0 22px 44px rgba(0,0,0,.5)}
.choice.fiche.on::after{top:12px; right:12px; width:34px; height:34px; z-index:2; background:#16a34a; box-shadow:0 4px 10px rgba(0,0,0,.3)}
.choice.fiche .photo{height:140px}
.choice.fiche h4{margin:14px 18px 6px; padding-right:0; font:800 20px/1.2 var(--doc); color:var(--encre)}
.choice.fiche p{margin:0 18px; font-size:16px; color:var(--encre-douce)}
.fiche.methode .photo{height:122px}
.fiche.methode .photo svg{position:relative; z-index:1; width:150px; height:100px; filter:drop-shadow(0 8px 8px rgba(0,0,0,.18)); transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.choice.fiche.methode:hover .photo svg{transform:scale(1.06) rotate(-3deg)}
.fiche.methode .pro,.fiche.methode .con{margin:7px 18px 0; font-size:15px; font-weight:600}
.fiche.methode .pro{color:#15803d}
.fiche.methode .con{color:#b91c1c}
.fiche.methode .tag{margin:12px 18px 0; background:#fff4cc; color:#5f4500; border:1px dashed #c9a02e; font-size:14px}
@media (max-width:640px){ .grid.biens{grid-template-columns:1fr !important} }

/* ─── Offres de prix : 3 feuilles à en-tête posées sur le bureau ─── */
.bureau-offres{padding:42px 26px 30px}
.bureau-offres .offres{gap:22px}
.offre-cell{position:relative; display:flex; min-width:0}
.offre-pose{display:flex; width:100%}
.pince{position:absolute; top:-32px; right:30px; z-index:4; width:24px; height:66px; transform:rotate(7deg); pointer-events:none; filter:drop-shadow(1px 2px 1px rgba(0,0,0,.35)); animation:m2-pince .45s cubic-bezier(.3,1.5,.5,1) both}
.pince svg{display:block; width:100%; height:100%}
@keyframes m2-pince{from{opacity:0; transform:translateY(-26px) rotate(7deg)}}
@media screen{
  .offre{--f:#1E2A5A; --t:#fff; width:100%; padding:0 18px 16px; gap:7px; border:0; border-radius:3px; color:var(--encre); font-family:var(--doc);
    background:var(--papier) var(--grain); box-shadow:0 1px 1px rgba(0,0,0,.06), 0 3px 6px rgba(0,0,0,.12), 0 16px 32px rgba(0,0,0,.38); transition:transform .3s cubic-bezier(.2,.9,.3,1.2), box-shadow .3s}
  .offre-cell:nth-child(1) .offre{transform:rotate(-1deg)}
  .offre-cell:nth-child(2) .offre{transform:rotate(.7deg) translateY(5px)}
  .offre-cell:nth-child(3) .offre{transform:rotate(-.45deg)}
  .offre-cell .offre:hover{transform:translateY(-6px)}
  .offre-cell .offre.on{z-index:2; transform:translateY(-10px); box-shadow:0 0 0 4px #22c55e, 0 28px 52px rgba(0,0,0,.55)}
  .offre.on::after{content:"✓ Mon choix"; top:-15px; left:14px; right:auto; padding:5px 14px; border-radius:6px; background:#16a34a; color:#fff; font:800 14px var(--doc); box-shadow:0 4px 10px rgba(0,0,0,.3); transform:rotate(-2deg)}
  .offre .oh{display:flex; align-items:center; gap:12px; margin:0 -18px; padding:14px 18px 11px; border-bottom:2px solid var(--f)}
  .of-logo{flex:none; width:46px; height:46px}
  .of-logo svg{display:block; width:100%; height:100%}
  .of-id{min-width:0}
  .offre .oh b{font-size:17px; line-height:1.2}
  .offre .oh small{font-size:12.5px; color:#5d6278}
  .offre .ot{margin-top:4px; font-size:13px; color:#5d6278}
  .offre .atout{font-size:13px}
  .offre .art{font-size:17px}
  .offre .det{font-size:15px; color:#3f4560}
  .offre .lines{font-size:15px; border-top-color:#d9dce6}
  .offre .tot{font-size:16px; border-radius:6px; background:color-mix(in srgb, var(--f) 7%, #fff); border:1.5px solid color-mix(in srgb, var(--f) 35%, #fff)}
  .offre.on .tot span:last-child{margin:0 -5px; padding:0 5px; border-radius:2px; background:linear-gradient(transparent 12%, #fff07a 12%, #ffe94d 88%, transparent 88%)}
  .offre .cond{font-size:14.5px; color:#3f4560}
  .offre .valid{font-size:12.5px; color:#7a7f96}
  .offre.niv-petit .oh{border-bottom:0; border-radius:3px 3px 0 0; background:var(--f); color:var(--t)}
  .offre.niv-petit .oh b,.offre.niv-petit .oh small{color:var(--t)}
  .offre.niv-petit .oh small{opacity:.9}
  .offre.niv-petit .of-logo{border-radius:12px; box-shadow:0 0 0 2px var(--t)}
  .offre.niv-petit .atout{border-radius:6px; background:#ffe14d; color:#7a1d00; font-weight:800; box-shadow:0 2px 0 #c9a800; transform:rotate(-3deg)}
  .offre.niv-milieu .oh{border-bottom-width:3px}
  .offre.niv-milieu .atout{background:color-mix(in srgb, var(--f) 12%, #fff); color:var(--f)}
  .offre.niv-haut{background-color:#fbf6ea}
  .offre.niv-haut .oh{flex-direction:column; gap:6px; padding-top:16px; text-align:center; border-bottom:3px double var(--f)}
  .offre.niv-haut .oh b{font-family:var(--serif); font-size:19px; letter-spacing:.02em}
  .offre.niv-haut .atout{background:none; border:1.5px solid #b8912f; color:#6f530f}
}
@media screen and (max-width:1000px){ .offre-cell .offre{transform:none} }
.tableur{margin-top:24px; overflow:hidden; border-radius:10px; color:#1f2433; font-family:var(--doc); background:#fff; border:1px solid #c5cad6; box-shadow:0 18px 40px rgba(0,0,0,.45)}
.tb-barre{display:flex; align-items:center; gap:10px; padding:9px 14px; background:linear-gradient(180deg,#22804a,#1a6a3c); color:#fff}
.tb-barre h3.sub{margin:0; font:700 16px var(--doc); color:#fff}
.tb-app{margin-left:auto; font:600 13px var(--doc); opacity:.85}
.tb-ico{flex:none; width:20px; height:20px; border-radius:4px; background-color:#fff;
  background-image:linear-gradient(#22804a,#22804a), linear-gradient(#22804a,#22804a), linear-gradient(#22804a,#22804a);
  background-size:2px 100%, 100% 2px, 100% 2px; background-position:45% 0, 0 35%, 0 68%; background-repeat:no-repeat}
.tb-formule{display:flex; align-items:center; gap:10px; padding:6px 12px; border-bottom:1px solid #d6d9e3; background:#f7f8fa; font:500 14px var(--mono); color:#3f4560}
.tb-cell{min-width:44px; padding:1px 8px; border:1px solid #d0d4de; background:#fff; text-align:center; font-weight:700}

.tableur .help{margin:0; padding:9px 14px 11px; color:#3f4560; background:#f7f8fa; border-top:1px solid #e3e5ee}
.fiche-raisons{margin-top:18px; padding:18px 20px 20px; border-radius:4px; color:var(--encre); font-family:var(--doc); background:var(--papier) var(--grain); box-shadow:var(--ombre-papier)}
.fiche-raisons label.f{font-size:17px; color:var(--encre)}
.fiche-raisons .chip{position:relative; padding:9px 16px 9px 40px; border-radius:10px; background:#fff; color:var(--encre); border:2px solid #c6cbdb; font-size:16px}

.fiche-raisons .chip.on::before{content:"✓"; display:grid; place-items:center; background:#1d3b8f; border-color:#1d3b8f; color:#fff; font-size:12px; font-weight:800; line-height:1}

/* ─── Studio et bon de commande : la feuille sur le bureau, le cachet de l'entreprise ─── */
.bureau-mini{margin-top:0; padding:16px; border-radius:18px}
@media (max-width:640px){ .bureau-mini{padding:8px; border-radius:12px} .studio-prev .bureau-mini .paper{zoom:.6} }
.bureau-bc{padding:36px 30px 56px}
.doc-pose{z-index:2; max-width:840px; margin:0 auto}

.bureau > .stylo{position:absolute; z-index:1; right:9%; bottom:10px; width:230px; transform:rotate(-7deg); pointer-events:none; filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.paper .sig > div{position:relative}
.doc-perso .signed.pv-sig{color:#9A9DB4 !important}
.cachet,.tampon-recu{display:none; position:absolute; z-index:2; right:calc(100% + 6px); flex-direction:column; align-items:center; white-space:nowrap; pointer-events:none}

/* ─── Commande prête : le smartphone, le calendrier de livraison ─── */

.phone .notif{animation-delay:.45s}

.tel-bas{display:flex; justify-content:space-between; margin-top:24px; padding:0 6px}
.tel-bas span{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:18px; background:rgba(255,255,255,.16)}
.tel-home{position:absolute; left:50%; bottom:11px; width:108px; height:5px; margin-left:-54px; border-radius:3px; background:rgba(255,255,255,.75)}

/** Appelle une fonction de la base. Erreurs possibles : « reseau », « timeout », « serveur ». */
async function rpc(fonction, args, timeout = 15000, keepalive = false){
  if (CONFIG.HORS_LIGNE) throw new Error("reseau");
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/rpc/" + fonction, { method:"POST", keepalive, signal:ctrl.signal,
      headers:{ "apikey":CONFIG.SUPABASE_CLE, "Content-Type":"application/json" }, body:JSON.stringify(args) });
    if (!r.ok) throw new Error("serveur");
    return await r.json();
  } catch(e) {
    throw new Error(e.name === "AbortError" ? "timeout" : e.message === "serveur" ? "serveur" : "reseau");
  } finally { clearTimeout(t); }
}
/** Lectures : « ping » (l'accès est-il ouvert ?) et « connexion » (tout ce qu'il faut au démarrage). */
function appelServeur(params, timeout = 15000){
  const mission = String(params.mission || CONFIG.MISSION);
  return params.action === "ping" ? rpc("me_ping", { p_mission:mission }, timeout)
    : rpc("me_connexion", { p_email:params.email, p_mission:mission }, timeout);
}
/** Enregistre le travail. Réponse : { ok, statut } ou { ok:false, erreur } ; null si le réseau a échoué. */

  return rpc("me_enregistrer", { p_paquet:data }, 20000).catch(() => null);
}

//  SAUVEGARDES ESPACÉES
//  (au plus un envoi « en_cours » toutes les 10 s par élève, sauf étape importante ;
//   l'état le plus récent part toujours, avec un petit décalage aléatoire)
// ======================================================================
let DERNIERE_SAUVEGARDE = 0, SAUVEGARDE_PREVUE = null, DERNIER_PING = 0;
const PAUSE_SAUVEGARDE = 10000, PAUSE_PING = 30000;
function sauvegarder(force){
  const ecoule = Date.now() - DERNIERE_SAUVEGARDE;
  if (force || ecoule >= PAUSE_SAUVEGARDE){
    annulerSauvegardePrevue(); DERNIERE_SAUVEGARDE = Date.now(); envoyer("en_cours"); return;
  }
  if (!SAUVEGARDE_PREVUE) SAUVEGARDE_PREVUE = setTimeout(() => {
    SAUVEGARDE_PREVUE = null;
    if (["achat","briefing","accueil"].includes(MODE)){ DERNIERE_SAUVEGARDE = Date.now(); envoyer("en_cours"); }
  }, PAUSE_SAUVEGARDE - ecoule + Math.random() * 3000);
}
function annulerSauvegardePrevue(){ clearTimeout(SAUVEGARDE_PREVUE); SAUVEGARDE_PREVUE = null; }
const pingAutorise = () => { if (Date.now() - DERNIER_PING < PAUSE_PING) return false; DERNIER_PING = Date.now(); return true; };
// Si l'élève ferme la page avec une sauvegarde en attente, on l'envoie quand même (requête « keepalive »).
window.addEventListener("pagehide", () => {
  if (SAUVEGARDE_PREVUE && ["achat","briefing","accueil"].includes(MODE)){
    try { rpc("me_enregistrer", { p_paquet:payload("en_cours") }, 10000, true).catch(() => {}); } catch(e) {}
  }
});

/** Version plus foncée d'une couleur (dégradé de la carte bancaire). */
function assombrir(hex, f){
  let h = String(hex || "").replace("#", ""); if (h.length === 3) h = h.split("").map(x => x + x).join("");
  const n = parseInt(h, 16); if (h.length !== 6 || isNaN(n)) return "#1E2A5A";
  const c = (v) => Math.round(v * (1 - f)).toString(16).padStart(2, "0");
  return "#" + c((n >> 16) & 255) + c((n >> 8) & 255) + c(n & 255);
}

      const pause = Math.max(40, Math.round(ms * .085));
      etapesScene(el, ms, [[.2, () => { sc.classList.add("code"); SON.jouer("bip");
        (async () => {

          await KIT.taperTouches(term, ["✔"], pause); if (el.isConnected){ sc.classList.add("ok"); SON.jouer("caisse"); }
        })().catch(() => {}); }]]);
    } };

/** Le tampon se pose quand le document est vérifié et signé (mêmes conditions que le bouton d'envoi). */
function poserTampon(el, ok){
  if (!el) return; const pose = el.classList.contains("pose");
  if (ok && !pose){ el.classList.add("pose", "frappe"); setTimeout(() => SON.jouer("tampon"), 260); }
  else if (!ok && pose) el.classList.remove("pose", "frappe");
}
function majTampons(){
  const vbc = $("#vbc"), sbc = $('[data-bind="signBC"]');
  poserTampon($(".cachet"), !!(vbc && sbc && vbc.checked && sbc.value.trim().length >= 3));
  const cks = [...document.querySelectorAll("#main [data-check]")], sbl = $('[data-bind="signBL"]');
  poserTampon($(".tampon-recu"), cks.length > 0 && cks.every(c => c.checked) && !!sbl && sbl.value.trim().length >= 3);
}
["input","change"].forEach(t => document.addEventListener(t, () => queueMicrotask(majTampons)));
/** Le colis s'ouvre et se referme (purement visuel). */
function basculerColis(z){
  const c = z.querySelector(".colis"); if (!c) return;
  const ouvert = c.classList.toggle("ouvert"); z.setAttribute("aria-pressed", String(ouvert));
  const t = z.querySelector(".cb-astuce"); if (t) t.textContent = ouvert ? "Clique encore pour refermer le colis" : "Clique sur le colis pour l'ouvrir";
  SON.jouer("papier");
}
document.addEventListener("click", (e) => { const z = e.target.closest && e.target.closest(".colis-zone"); if (z) basculerColis(z); });
document.addEventListener("keydown", (e) => { const z = e.target; if ((e.key === "Enter" || e.key === " ") && z.classList && z.classList.contains("colis-zone")){ e.preventDefault(); basculerColis(z); } });
/** Sons d'arrivée des écrans : data-son="nom:délai …" sur un élément qui porte data-anim (une seule fois, jamais avant le premier clic). */
(function(){
  const joues = new Set();
  const planifier = (el) => {
    const cle = el.getAttribute("data-anim"); if (!cle || joues.has(cle)) return; joues.add(cle);
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    String(el.getAttribute("data-son") || "").split(/\s+/).filter(Boolean).forEach(x => { const [nom, d] = x.split(":");
      setTimeout(() => { if (document.querySelector(`[data-anim="${cle}"]`)) SON.jouer(nom); }, +d || 0); });
  };
  new MutationObserver(l => l.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType !== 1) return;
    if (n.matches("[data-son]")) planifier(n); n.querySelectorAll("[data-son]").forEach(planifier); }))).observe(document.body, { childList:true, subtree:true });
})();

const ERREURS = {
  email_invalide:"Cette adresse n'est pas valide. Elle doit ressembler à prenom.nom@istlm.org.",
  non_inscrit:"Cette adresse n'est pas sur la liste de ta classe. Vérifie l'orthographe ou demande à ton professeur.",
  reseau:"Impossible de joindre le serveur. Vérifie ta connexion internet puis réessaie.",
  timeout:"Le serveur ne répond pas pour l'instant. Patiente quelques secondes, puis clique à nouveau.",
  serveur:"Le serveur a refusé la demande. Préviens ton professeur (la base de données doit être vérifiée)."

async function seConnecter(email){
  LOGIN.busy = true; LOGIN.err = ""; LOGIN.lent = false; render();
  SESSION.email = email;
  const lent = setTimeout(() => { if (LOGIN.busy){ LOGIN.lent = true; render(); } }, 6000);
  let r;
  try { r = await connexion(); } catch(e) { clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false; LOGIN.err = ERREURS[e.message] || ERREURS.reseau; MODE = "login"; render(); return; }
  clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false;
  if (!r || !r.ok){ LOGIN.err = ERREURS[r && r.erreur] || "Connexion refusée. Demande à ton professeur."; MODE = "login"; render(); return; }
  appliquerConnexion(r, email);
}
/** Identité de l'élève : les champs vides ne remplacent jamais un nom déjà connu (déduit de l'adresse e-mail). */
function identite(email, ...sources){
  const id = Object.assign({email}, nomDepuisEmail(email), {classe:CONFIG.CLASSE_DEFAUT});
  sources.forEach(s => { if (s) ["prenom","nom","classe"].forEach(k => { if (s[k] && String(s[k]).trim()) id[k] = String(s[k]).trim(); }); });
  id.email = email;
  return id;
}
function appliquerConnexion(r, email){
  SESSION.diag = r.diagnostic || null;
  const d = r.dossier, m1 = d && d.missions ? d.missions["1"] : null;
  S.eleve = identite(email, d && d.eleve, r.eleve);
  if (!m1 || m1.statut !== "termine"){ MODE = "bloque"; render(true); return; }
  M1 = lireM1(d);
  const m = d.missions[CONFIG.MISSION] || null, serveur = m && m.etatApp ? m.etatApp : null, local = lireLocal(email), eleve = S.eleve;
  if (r.statut === "termine"){ S = restaurer(serveur); MODE = "consultation"; S.envoi = {mode:"ok"}; }
  else if (!r.ouvert){ S = restaurer(serveur || local); MODE = "ferme"; }
  else if (r.statut === "reinitialise"){ S = fresh(); MODE = "accueil"; toast("<div>🔄 Ton professeur a rouvert ta mission 2 : tu peux refaire tes achats.</div>"); }
  else if (r.statut === "en_cours"){ const t = m.dernier_envoi ? Date.parse(m.dernier_envoi) : 0; S = restaurer(local && local.majLocale > t ? local : serveur); MODE = S.phase || "accueil"; }
  else { S = restaurer(local && local.phase !== "fin" ? local : null); MODE = S.phase || "accueil"; }
  S.eleve = eleve;
  if (!S.startedAt) S.startedAt = Date.now();
  if (MODE === "achat" && !A()){ S.achats.push(nouvelAchat()); S.i = S.achats.length - 1; }
  save(); render(true);
}
async function verifierOuvert(){
  try { const r = await appelServeur({action:"ping", mission:CONFIG.MISSION}, 10000); if (r && r.diagnostic) SESSION.diag = r.diagnostic;
    return !!(r && r.acces && (r.missionsOuvertes || []).indexOf(CONFIG.MISSION) >= 0); }
  catch(e) { return true; }
}
async function controlerEnFond(){ if (!pingAutorise()) return; if (!(await verifierOuvert()) && ["achat","accueil","briefing"].includes(MODE)){ annulerSauvegardePrevue(); MODE = "ferme"; save(); render(true); } }

function overlay(emojis, texte, ms, scene){     // scene (facultative) : { html, jouer(el, ms) } dessinée à la place des emojis, même durée
  return new Promise(res => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) ms = 400;
    const o = document.createElement("div"); o.className = scene ? "overlay overlay-scene" : "overlay";
    o.innerHTML = scene ? `<div class="scene-boite">${scene.html}<p>${texte}</p></div>`
      : `<div><div class="big">${emojis.map(e => `<span>${e}</span>`).join("")}</div><p>${texte}</p></div>`;
    document.body.appendChild(o);
    if (scene && scene.jouer) try { scene.jouer(o, ms); } catch(e) {}
    setTimeout(() => { o.remove(); res(); }, ms);
  });
}

/** La base répond tout de suite ; si la réponse s'est perdue, on vérifie en relisant le dossier. */
async function confirmerEnvoi(res){
  if (res && (res.ok || res.erreur === "mission_deja_terminee")){ S.envoi = {mode:"ok"}; save(); render(); return; }
  if (res && (res.erreur === "acces_ferme" || res.erreur === "mission_fermee")){ S.envoi = {mode:"ferme"}; save(); render(); return; }
  for (let i = 0; i < 4; i++){
    await wait(2000 + i*1500);
    try { const r = await connexion();
      if (r && r.ok && r.statut === "termine"){ S.envoi = {mode:"ok"}; save(); render(); return; }
      if (r && r.ok && !r.ouvert){ S.envoi = {mode:"ferme"}; save(); render(); return; } } catch(e) {}
  }
  S.envoi = {mode:"err"}; save(); render();
}

// ======================================================================
//  AFFICHAGE
// ======================================================================
function updateTop(){
  $("#xpPill").textContent = S.xp + " XP"; $("#lvlName").textContent = niveau();
  const vis = !["login","bloque"].includes(MODE);
  $("#lvlBox").style.visibility = vis ? "visible" : "hidden"; $("#xpPill").parentElement.style.visibility = vis ? "visible" : "hidden";
  $("#who").innerHTML = MODE !== "login" && S.eleve.email ? `<b>${esc(S.eleve.prenom)} ${esc(S.eleve.nom)}</b><button data-act="logout">Changer de compte</button>` : "";
  const st = $("#steps"), a = MODE === "achat" ? A() : null;
  st.style.display = a ? "grid" : "none";
  if (a) st.innerHTML = ETAPES_ACHAT.map((e,i) => { const cls = a.etape > i ? "done" : (a.etape === i ? "now" : "");
    return `<div class="seg ${cls}" title="${esc(e[1])}"><span>Achat ${S.i + 1}/${CONFIG.NB_ACHATS} · ${i+1}. ${esc(e[1])}</span></div>`; }).join("");
}
function renderSide(){
  const side = $("#side");
  if (MODE !== "achat" || ["offres","commande","livraison","patrimoine"].includes(etapeKey())){ side.innerHTML = ""; $("#layout").classList.add("full"); return; }
  $("#layout").classList.remove("full");
  const a = A(), o = offreDe(a);
  side.innerHTML = `<div class="sign glass"><div class="front-wrap" style="border-radius:0">${vitrine("side")}</div>
    <div class="sign-body"><h3>${esc(deno())}</h3>
      <div class="srow"><div class="k">En banque</div><div class="v" style="font-family:var(--mono);color:#9ff0c9">${eur(enBanque())}</div></div>
      ${BIENS.map(b => { const fait = S.achats.find(x => x.bien === b.id && x.paye); return `<div class="srow"><div class="k">${b.icone} ${esc(b.court)}</div><div class="v ${fait ? "" : "todo"}">${fait ? "✓ " + esc(offreDe(fait).fournisseur.nom) : (a.bien === b.id ? "en cours…" : "à acheter")}</div></div>`; }).join("")}
      ${o ? `<div class="srow"><div class="k">Offre choisie</div><div class="v">${esc(o.fournisseur.nom)} · ${eur(o.total)}</div></div>` : ""}
      <div class="pbar"><i style="width:${Math.round(achatsPayes().length / CONFIG.NB_ACHATS * 100)}%"></i></div><div class="help">${achatsPayes().length} achat${achatsPayes().length > 1 ? "s" : ""} sur ${CONFIG.NB_ACHATS}</div></div></div>`;
}
function render(scroll){
  setBrand(M1 && !["login","bloque"].includes(MODE) ? M1.couleur : null);
  let key = MODE;
  if (MODE === "achat") key = etapeKey();
  if (MODE === "consultation") key = "fin";
  $("#main").innerHTML = R[key]();
  $("#topSub").textContent = key === "fin" ? "Mission 2 accomplie" : "Mission 2 : équipe ton entreprise";
  updateTop(); renderSide();
  if (MODE === "login"){ const em = $("#em"); if (em && !LOGIN.busy) em.focus(); }
  if (scroll) window.scrollTo({top:0, behavior:"smooth"});
}
function refreshLive(){
  if (MODE !== "achat") return;
  const a = A(), k = etapeKey(); let ok = true;
  if (k === "commande") ok = a.verifBC && a.signBC.trim().length >= 3;
  if (k === "livraison") ok = a.checks.every(Boolean) && a.signBL.trim().length >= 3;
  const b = $('[data-act="envoyerBC"],[data-act="accepter"]'); if (b) b.disabled = !ok;
  const h = $("#main .nav .hint"); if (h) h.style.visibility = ok ? "hidden" : "visible";
}

// ======================================================================
//  ÉVÉNEMENTS
// ======================================================================
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "em"){ LOGIN.email = el.value; const b = $('[data-act="login"]'); if (b) b.disabled = !emailOk(el.value.trim().toLowerCase()); return; }
  if (MODE === "achat" && el.dataset.bind){ A()[el.dataset.bind] = el.value; save(); refreshLive(); }
});
document.addEventListener("change", (e) => {
  if (MODE !== "achat") return;
  if (e.target.id === "vbc"){ A().verifBC = e.target.checked; save(); refreshLive(); }
  if (e.target.dataset.check !== undefined){ A().checks[+e.target.dataset.check] = e.target.checked; save(); refreshLive(); }
  if (e.target.dataset.modchk && S.modele && !S.modele.verrouille){ S.modele[e.target.dataset.modchk] = e.target.checked; save(); render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("#modal").hidden = true;
  if (e.key === "Enter" && e.target.id === "em"){ const b = $('[data-act="login"]'); if (b && !b.disabled) b.click(); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "d" && M1){
    const m = $("#modal"); m.innerHTML = `<div class="box glass" role="dialog"><h3 style="font-family:var(--serif)">Données de la mission 2 (format envoyé à la base de données)</h3><pre>${esc(JSON.stringify(S.lastPayload || payload("apercu"), null, 2))}</pre><button class="btn btn-main" data-act="close">Fermer</button></div>`; m.hidden = false; }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "login"){ const em = LOGIN.email.trim().toLowerCase(); if (emailOk(em)) seConnecter(em); return; }
  if (b.dataset.act === "retry"){ seConnecter(S.eleve.email || SESSION.email); return; }
  if (b.dataset.act === "logout"){ save(); MODE = "login"; LOGIN = {email:"", busy:false, err:""}; S = fresh(); M1 = null; render(true); return; }
  if (b.dataset.act === "close"){ $("#modal").hidden = true; return; }
  if (b.dataset.act === "resend"){ S.envoi = {mode:"wait"}; render(); envoyer("termine").then(confirmerEnvoi); return; }
  if (b.dataset.act === "print"){ $("#print-area").innerHTML = dossierImpression(); window.print(); return; }
  if (b.dataset.act === "brief"){ MODE = "briefing"; S.phase = "briefing"; save(); render(true); return; }
  if (b.dataset.act === "start"){ if (!S.achats.length){ S.achats.push(nouvelAchat()); S.i = 0; } MODE = "achat"; S.phase = "achat"; save(); render(true); sauvegarder(false); controlerEnFond(); return; }
  if (MODE !== "achat") return;
  const a = A();
  if (b.dataset.set === "bien"){ if (a.bien !== b.dataset.val){ a.bien = b.dataset.val; a.offres = null; a.choix = null; a.raisons = []; } save(); render(); return; }
  if (b.dataset.set === "methode"){ a.methode = b.dataset.val; save(); render(); return; }
  if (b.dataset.offre !== undefined){ a.choix = +b.dataset.offre; save(); render(); return; }
  if (b.dataset.mod){ choisirModele(b.dataset.mod, b.dataset.val); return; }
  if (b.dataset.raison){ const r = b.dataset.raison, i = a.raisons.indexOf(r);
    if (i >= 0) a.raisons.splice(i,1); else if (a.raisons.length < 2) a.raisons.push(r); else { toast("<div>Deux raisons maximum.</div>"); return; }
    save(); render(); return; }
  switch (b.dataset.act){
    case "next": avancer(); break;
    case "back": if (a.etape > 0 && !a.envoyeBC){ a.etape--; save(); render(true); } break;
    case "chercher": chercher(); break;
    case "envoyerBC": envoyerBC(); break;
    case "adopter": adopterModele(); break;
    case "retoucher": if (S.modele && !S.modele.verrouille){ S.modele.valide = false; save(); render(true); } break;
    case "accepter": accepterLivraison(); break;
    case "payer": payer(); break;
    case "suivantAchat": suivantAchat(); break;
    case "terminer": terminer(); break;
  }
});

// Préparation automatique des documents quand on arrive sur une étape
const _render = render;
render = function(scroll){
  if (MODE === "achat" && A()){
    const a = A(), k = etapeKey();
    if (k === "livraison" && !a.bl){ const o = offreDe(a);
      a.bl = { numero:`BL-${o.fournisseur.code}-${String(hash(S.eleve.email + a.bien) % 90000 + 10000)}`, date:dateFr(today()), colis: a.bien === "mobilier" ? 6 : 1 }; save(); }
  }
  _render(scroll);
};
render();

// ======================================================================
//  MODE TEST POUR LE PROFESSEUR : ajouter « ?test » à l'adresse de la page
//  → un élève fictif qui a déjà terminé la mission 1 ; RIEN n'est envoyé à la base de données.
//  Options : ?test&activite=velos&strategie=haut&forme=srl  (activités : ferme, pepiniere, chocolaterie,
//  textile, baskets, gaming, velos, animalerie ; stratégies : petit, milieu, haut ; forme : seul ou srl)
// ======================================================================
(function(){
  const qs = new URLSearchParams(location.search);
  if (!qs.has("test")) return;
  const activite = TYPES.some(x => x.id === qs.get("activite")) ? qs.get("activite") : "velos";
  const strategie = ["petit","milieu","haut"].includes(qs.get("strategie")) ? qs.get("strategie") : "milieu";
  const direction = qs.get("forme") === "srl" ? "plusieurs" : "seul";
  const t = TYPES.find(x => x.id === activite), st = STRATEGIES.find(x => x.id === strategie);
  const couleurs = { ferme:"#30A46C", pepiniere:"#12A594", chocolaterie:"#8E4EC6", textile:"#3E63DD", baskets:"#E5484D", gaming:"#3E63DD", velos:"#F76B15", animalerie:"#E93D82" };
  const nom = t.noms[0], slug = nom.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  const EMAIL = "eleve.test@istlm.org", ELEVE = { email:EMAIL, prenom:"Élève", nom:"Test", classe:"3P Vente" };
  const dossier = { eleve:ELEVE, missions:{ "1":{ statut:"termine" } },
    entreprise:{ typeId:activite, activite:t.nom, secteur:t.secteur, nom, denomination: nom + (direction === "plusieurs" ? " SRL" : ""), slogan:t.slogans[0],
      strategie:{ id:strategie, nom:st.nom }, forme: direction === "plusieurs" ? "Société (SRL)" : "Entreprise individuelle", direction, nbAssocies:1,
      identiteVisuelle:{ couleurPrincipale:couleurs[activite], couleurAccompagnement:"#FFFFFF", styleEcriture:"moderne", symbole:t.symboles[0] },
      boutique:{ facade:"brique", auvent:"raye", ambiance:"lumineuse", phraseAccueil:"Bienvenue chez nous !" },
      adresse:{ rue:"Rue Neuve", numero:"12", cp:"7080", commune:"Frameries" }, email:`contact@${slug}.be`,
      numeroEntreprise:"1498.551.020", numeroTVA:"BE 1498.551.020", iban:"BE71 0631 2345 6769", dateCreation:"5 octobre 2026",
      argent:{ argentDeDepart:APPORT, fraisDeCreation:FRAIS[direction], argentEnBanque:APPORT - FRAIS[direction] } } };
  CONFIG.STORAGE_PREFIX = "mini-entreprise-3p-m2-test-";
  CONFIG.HORS_LIGNE = true;                                         // aucune donnée ne part vers la base
  try { localStorage.removeItem(CONFIG.STORAGE_PREFIX + EMAIL); } catch(e) {}
  const diag = { versionScript:"test", mission:"2", raison:"Mode test", verrouActif:"OUI", missionsOuvertesLues:["1","2","3"] };
  appelServeur = function(params){
    const attente = new Promise(r => setTimeout(r, 250));
    if (params.action === "ping") return attente.then(() => ({ ok:true, acces:true, missionsOuvertes:["1","2","3"], diagnostic:diag }));
    const fini = dossier.missions["2"] && dossier.missions["2"].statut === "termine";
    return attente.then(() => ({ ok:true, ouvert:true, statut: fini ? "termine" : "nouveau", eleve:ELEVE, dossier:JSON.parse(JSON.stringify(dossier)), compteurs:{}, max:6, diagnostic:diag }));
  };
  envoyer = function(statut){
    const data = payload(statut); S.lastPayload = data;
    if (statut === "termine") dossier.missions["2"] = Object.assign({}, data, { statut:"termine" });
    return Promise.resolve({ ok:true, email:EMAIL, mission:"2", statut });
  };
  // Bandeau du mode test
  const b = document.createElement("div");
  b.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:90;background:#FFF3C4;color:#1D1F33;border:2px solid #F5C451;border-radius:14px;padding:10px 14px;font:600 14px Outfit,Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)";
  const opt = (liste, val) => liste.map(([v, l]) => `<option value="${v}" ${v === val ? "selected" : ""}>${l}</option>`).join("");
  b.innerHTML = `🧪 MODE TEST : rien n'est enregistré
    <select id="tAct" style="font:inherit;padding:3px 6px;border-radius:8px">${opt(TYPES.map(x => [x.id, x.emoji + " " + x.nom]), activite)}</select>
    <select id="tStr" style="font:inherit;padding:3px 6px;border-radius:8px">${opt([["petit","💰 Petits prix"],["milieu","⚖️ Qualité-prix"],["haut","💎 Haut de gamme"]], strategie)}</select>
    <select id="tFor" style="font:inherit;padding:3px 6px;border-radius:8px">${opt([["seul","🙋 Individuelle"],["srl","🏢 Société (SRL)"]], direction === "plusieurs" ? "srl" : "seul")}</select>
    <button id="tGo" style="font:inherit;padding:4px 12px;border-radius:8px;border:0;background:#1D1F33;color:#fff;cursor:pointer">Recommencer</button>`;
  document.body.appendChild(b);
  const relancer = () => { location.search = `?test&activite=${$("#tAct").value}&strategie=${$("#tStr").value}&forme=${$("#tFor").value}`; };
  ["#tAct","#tStr","#tFor"].forEach(s => $(s).addEventListener("change", relancer)); $("#tGo").addEventListener("click", relancer);
  LOGIN.email = EMAIL; seConnecter(EMAIL);
})();
</script>
